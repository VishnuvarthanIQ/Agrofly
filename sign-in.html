<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | AgroFly – Precision Agriculture Drone Spraying</title>
    <meta name="description" content="Sign In to your AgroFly account to manage drone spraying jobs, view field reports, and book pilots.">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link id="bsCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>/* apply saved theme + direction before paint */(function(){var d=document.documentElement,t=localStorage.getItem('agro_theme')||'light',r=localStorage.getItem('agro_dir')||'ltr';d.dataset.bsTheme=t;d.dir=r;if(r==='rtl')document.getElementById('bsCss').href=document.getElementById('bsCss').href.replace('bootstrap.min.css','bootstrap.rtl.min.css')})()</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>tailwind.config={corePlugins:{preflight:false,visibility:false},blocklist:['collapse']}</script>
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/animations.css" rel="stylesheet">
    <link href="assets/css/responsive.css" rel="stylesheet">
  </head>
  <body data-root="" data-page="sign-in" class="auth-page">
    <!-- 1. Full-Width Authentication Header: Same Primary Background, Theme & RTL Toggles ONLY -->
            <header class="auth-header" id="authHdr">
      <div class="container d-flex justify-content-end align-items-center gap-2">
        <div class="nav-toggles-row">
                <button class="icon-btn js-theme" type="button" aria-label="Toggle Theme Mode" title="Toggle Light / Dark Mode">
          <i class="bi bi-moon-stars"></i>
        </button>
        <button class="icon-btn js-rtl" type="button" aria-label="Toggle RTL Mode" title="Toggle Direction (LTR / RTL)">
          <i class="bi bi-arrow-left-right"></i>
        </button>
              </div>
      </div>
    </header>

    <main class="auth">
      <img class="hero-bg" src="https://images.unsplash.com/photo-1560493676-04071c5f467b?auto=format&fit=crop&w=1600&q=70" alt="Farm field background">
      <div class="hero-ov"></div>

      <div class="auth-card">
        <!-- 1. AGROFLY Drone Logo & Brand Name Centered Group -->
        <div class="auth-brand-group mb-3 text-center">
          <a class="brand justify-content-center" href="index.html" title="Back to AgroFly Home">
            <span class="logo-box"><img src="assets/img/logo.svg" alt="AgroFly" class="brand-drone-icon"></span>
            <span>AGRO<b>FLY</b></span>
          </a>
        </div>

        <!-- 2. Welcome Heading -->
        <h1 class="h4 text-center fw-bold mb-1">Welcome back</h1>
        <p class="text-center text-muted small mb-4">
          Sign in to manage your precision drone spraying operations.
        </p>

        <!-- Sign In Form (Inputs -> Main Button -> OR -> Social Buttons -> Link) -->
        <form novalidate data-form="signin">
          <!-- 3. Email Input -->
          <div class="mb-3">
            <label class="form-label" for="si_i">Email Address</label>
            <input id="si_i" type="email" class="form-control" data-v="required email" placeholder="name@example.com" autocomplete="username">
          </div>

          <!-- 4. Password Input -->
          <div class="mb-3">
            <label class="form-label" for="si_p">Password</label>
            <div class="input-group">
              <input id="si_p" type="password" class="form-control" data-v="required password" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="btn btn-eye" aria-label="Show or hide password"><i class="bi bi-eye"></i></button>
            </div>
          </div>

          <!-- 5. Remember Me and Forgot Password -->
          <div class="d-flex justify-content-between align-items-center mb-4 small">
            <label class="form-check-label d-flex align-items-center gap-2 mb-0">
              <input type="checkbox" id="si_r" class="form-check-input mt-0">
              <span>Remember me</span>
            </label>
            <a href="#" data-forgot class="text-decoration-none">Forgot password?</a>
          </div>

          <!-- 6. Main Sign In Button -->
          <button type="submit" class="btn btn-agro w-100 btn-lg mb-3">Sign In</button>

          <!-- 7. OR Separator -->
          <div class="auth-divider my-3 text-center">
            <span class="text-muted small px-2">or continue with</span>
          </div>

          <!-- 8 & 9. Social Login Buttons in the SAME ROW -->
          <div class="row g-2 mb-3">
            <div class="col-6">
              <button type="button" class="btn btn-social w-100 d-flex align-items-center justify-content-center gap-2 js-social-login" data-provider="Google" aria-label="Sign in with Google">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Google</span>
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn btn-social w-100 d-flex align-items-center justify-content-center gap-2 js-social-login" data-provider="Apple" aria-label="Sign in with Apple">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.98.6-2.62 1.35-.57.65-1.06 1.71-.93 2.73 1 .08 2.01-.48 2.63-1.23z"/>
                </svg>
                <span>Apple</span>
              </button>
            </div>
          </div>

          <!-- 10. Create Account Link -->
          <p class="text-center mt-4 mb-0 small text-muted">
            Don't have an account? <a href="sign-up.html" class="fw-bold text-agro text-decoration-none">Create Account</a>
          </p>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/rtl.js"></script>
    <script src="assets/js/validation.js"></script>
    <script src="assets/js/authentication.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
